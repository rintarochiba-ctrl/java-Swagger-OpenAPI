openapi: 3.0.3
info:
  title: User Management API
  description: ユーザー管理APIのOpenAPI仕様書を作成してください
  version: 1.0.0

servers:
  - url: http://localhost:8082
    description: ローカル開発環境

paths:
  /api/users:
    get:
      summary: ユーザー一覧取得
      description: すべてのユーザー一覧を取得します
      operationId: getUsers
      tags:
        - Users
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: ユーザー作成
      description: 新しいユーザーを作成します
      operationId: postUser
      tags:
        - Users
      responses:
        '201':
          description: 作成成功
          content:
            application/json:
              schema:
                type: object
                items:
                  $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/users/{id}:
    get:
      summary: ユーザー詳細取得
      description: 指定されたIDのユーザー情報を取得します
      operationId: getUserById
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          description: ユーザーID
          schema:
            type: integer
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      summary: ユーザー更新
      description: 指定されたIDのユーザー情報を更新します
      operationId: putUserById
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          description: ユーザーID
          schema:
            type: integer
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: ユーザー削除
      description: 指定されたIDのユーザーを削除します
      operationId: deleteUserById
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          description: ユーザーID
          schema:
            type: integer
      responses:
        '204':
          description: 削除成功
        '404':
          $ref: '#/components/responses/NotFound'

components:
  schemas:
    User:
      type: object
      required:
        - id
        - name
        - email
      properties:
        id:
          type: integer
          description: ユーザーID
          example: 1
        name:
          type: string
          description: ユーザー名
          example: "山田太郎"
        email:
          type: string
          description: メールアドレス
          example: "yamada@example.com"
        createdAt:
          type: string
          format: date-time
          description: 作成日時
          example: "2024-01-01T00:00:00Z"
        updatedAt:
          type: string
          format: date-time
          description: 更新日時
          example: "2024-01-01T00:00:00Z"

    UserRequest:
      type: object
      description: ユーザー作成・更新リクエスト
      required:
        - name
        - email
      properties:
        name:
          type: string
          description: ユーザー名
          example: 山田太郎
        email:
          type: string
          format: email
          description: メールアドレス
          example: yamada@example.com

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: エラーコード
          example: "INVALID_PARAMETER"
        message:
          type: string
          description: エラーメッセージ
          example: "ユーザー名は必須です"

  responses:
    BadRequest:
      description: リクエスト不正（入力エラー等）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: 指定されたリソースが存在しない
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalServerError:
      description: サーバー内部エラー
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
